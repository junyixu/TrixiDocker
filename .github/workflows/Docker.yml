# Build the precompiled GPU image (docker/Dockerfile) and push it to GHCR.
# Pods pull ghcr.io/<owner>/trixidocker instead of installing and precompiling
# Julia packages at boot. Two variants are built side by side: cuda (Runpod GPU
# pods) and tpu (Cloud TPU VMs). main publishes :latest and :tpu; a
# feat/docker-<name> branch publishes :<name> and :<name>-tpu to test first.

name: Docker

on:
    push:
        branches:
            - main
            - feat/docker-*
        paths:
            - docker/**
            - .github/workflows/Docker.yml
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    image:
        name: image (${{ matrix.accel }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                accel: [cuda, tpu]
        timeout-minutes: 300
        permissions:
            contents: read
            packages: write
        steps:
            # The depot holds two sets of CUDA artifacts plus Reactant's XLA build;
            # the stock runner is short on disk once the base image and build cache are added.
            - name: Free disk space
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
                  sudo docker image prune --all --force
                  df -h /
            # `COPY .` bakes .git into the image: don't leave the job token in
            # .git/config, or `git pull` inside a pod fails once it expires.
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # Cache busters for the dev-tools configs: a push to any of these
            # repos changes its REV, so only that layer onward is rebuilt.
            - name: Resolve config revisions and image tags
              id: rev
              run: |
                  rev() { git ls-remote "https://github.com/junyixu/$1.git" "$2" | cut -f1; }
                  echo "nvim=$(rev nvim-config main)" >> "$GITHUB_OUTPUT"
                  echo "zsh=$(rev zsh-config-public main)" >> "$GITHUB_OUTPUT"
                  echo "yazi=$(rev yazi-config-public main)" >> "$GITHUB_OUTPUT"
                  echo "repo_owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
                  if [ "$GITHUB_REF_NAME" = main ]; then tag=latest; else tag=${GITHUB_REF_NAME#feat/docker-}; tag=${tag//\//-}; fi
                  sha=${{ github.sha }}
                  if [ "${{ matrix.accel }}" = tpu ]; then
                      if [ "$tag" = latest ]; then tag=tpu; else tag=$tag-tpu; fi
                      sha=$sha-tpu
                  fi
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "sha=$sha" >> "$GITHUB_OUTPUT"
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  push: true
                  build-args: |
                      NVIM_REV=${{ steps.rev.outputs.nvim }}
                      ZSH_REV=${{ steps.rev.outputs.zsh }}
                      YAZI_REV=${{ steps.rev.outputs.yazi }}
                      ACCEL=${{ matrix.accel }}
                  tags: |
                      ghcr.io/${{ steps.rev.outputs.repo_owner }}/trixidocker:${{ steps.rev.outputs.tag }}
                      ghcr.io/${{ steps.rev.outputs.repo_owner }}/trixidocker:${{ steps.rev.outputs.sha }}
                  cache-from: type=gha,scope=${{ matrix.accel }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.accel }},ignore-error=true
